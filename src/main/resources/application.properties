spring.application.name=adegueto

# --- Banco de dados (PostgreSQL gerenciado por outro membro da equipe) ---
# Valores sobrescritos por variaveis de ambiente; nunca versionar senhas.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/adegueto}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate (decisao D8: sem Flyway em desenvolvimento) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Administrador inicial (decisao D7) ---
adegueto.admin.nome=${ADMIN_NOME:Administrador}
adegueto.admin.login=${ADMIN_LOGIN:admin}
adegueto.admin.senha=${ADMIN_SENHA:}

# --- Sessao HTTP (decisao D1) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
